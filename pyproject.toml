[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag"
version = "0.1.0"
description = "LocalRAG Hero Demo — agentic shop-floor assistant on a single GPU workstation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Northline Precision Applied AI" }]
keywords = ["rag", "agentic", "manufacturing", "faiss", "bm25", "local-llm", "nvidia"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
rag = [
  "faiss-cpu>=1.8",
  "sentence-transformers>=2.6",
  "transformers>=4.42",
  "torch>=2.2",
  "accelerate>=0.30",
  "langchain-core>=0.2",
  "langchain-community>=0.2",
]
gpu = ["pynvml>=11.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
all = [
  "faiss-cpu>=1.8",
  "sentence-transformers>=2.6",
  "transformers>=4.42",
  "torch>=2.2",
  "accelerate>=0.30",
  "langchain-core>=0.2",
  "langchain-community>=0.2",
  "pynvml>=11.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
localrag = "localrag.cli:app"

[tool.setuptools.packages.find]
include = ["localrag*"]

[tool.setuptools.package-data]
localrag = ["../config/default.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: slow or model-dependent tests (deselected in CI)",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["localrag"]
omit = ["localrag/bench.py"]
